<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">Rasheena Arimbrathodi — AI Engineer</title>
  <desc id="desc">Dark navy banner with turquoise and purple network lines, and a headline about building, evaluating, and deploying intelligent systems.</desc>
